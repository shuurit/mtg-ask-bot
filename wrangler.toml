name = "mtg-ask-bot"
main = "worker.js"
compatibility_date = "2026-01-01"
account_id = "8ca62cd3d17495e04f67d67caa28e0a8"

# Cloudflare reads this file directly when deploying from the connected
# GitHub repo (Workers & Pages -> Create -> Import a Git repository), so
# it needs real values, not placeholders. If you ever deploy with the
# wrangler CLI instead, this file works for that too -- no changes needed.

[ai]
binding = "MTGAI"

[vars]
# Tonk Tonk's existing Application ID (see archidekt-trading-app) -- reused
# rather than creating a new Discord Application. See README.md.
DISCORD_APPLICATION_ID = "1537979428133670962"
DISCORD_PUBLIC_KEY = "cdf791369ec1dade12055cc7ec08163f0a4e40c6724c0d845b92c47cd5c22f1c"
# Playgroup server ID -- registers /ask to this server only (instant),
# instead of globally (up to an hour to propagate). Remove this line to
# switch to global registration once everything works.
DISCORD_GUILD_ID = "1448929174537637940"

# DISCORD_BOT_TOKEN and REGISTER_SECRET are secrets, not vars -- never put
# them here. Set them with `wrangler secret put DISCORD_BOT_TOKEN` (and
# same for REGISTER_SECRET), or as Secret-type entries in the dashboard.
